name: Publish Amiasea GitHub REST API Client to CodeArtifact

on:
  workflow_call:
    inputs:
      codeartifact-nuget-url:
        description: CodeArtifact NuGet endpoint
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Download NuGet package
        uses: actions/download-artifact@v8.0.2
        with:
          name: nuget-package
          path: artifacts

      - name: Validate CodeArtifact endpoint
        id: repository
        env:
          NUGET_URL: ${{ inputs.codeartifact-nuget-url }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$NUGET_URL" =~ ^https://[^/]+/nuget/([a-z0-9][a-z0-9-]*)/v3/index\.json$ ]]; then
            echo "::error::Invalid CodeArtifact NuGet endpoint."
            exit 1
          fi

          echo "name=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.ARTIFACT_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Configure CodeArtifact NuGet source
        env:
          REPOSITORY: ${{ steps.repository.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail

          aws codeartifact login \
            --tool dotnet \
            --domain "${{ vars.CODEARTIFACT_DOMAIN }}" \
            --domain-owner "${{ vars.AWS_ACCOUNT_ID }}" \
            --repository "$REPOSITORY" \
            --region us-east-1

      - name: Publish package
        env:
          NUGET_URL: ${{ inputs.codeartifact-nuget-url }}
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          packages=(artifacts/*.nupkg)

          if (( ${#packages[@]} == 0 )); then
            echo "::error::No NuGet packages were downloaded."
            exit 1
          fi

          dotnet nuget push "${packages[@]}" \
            --source "$NUGET_URL" \
            --skip-duplicate